name: Corte Fino Motor 2 — CI

# PAUSED 2026-10-28: Corte Fino on hold, restore via Git history.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    # Pause guard: manual dispatch does not run the engine.
    if: ${{ false }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Dependências mínimas
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest>=8,<9" "google-api-python-client>=2,<3" "google-auth>=2,<3" "wordfreq>=3.1,<4"
      - name: Compilar Publisher
        run: python -m py_compile publisher/core.py publisher/google_io.py publisher/tiktok_io.py publisher/control.py publisher/performance.py publisher/metrics_io.py publisher/cli.py
      - name: Testar contratos críticos
        run: python -m pytest -q tests/test_publisher.py tests/test_publisher_control.py tests/test_publisher_performance.py tests/test_publisher_metrics_io.py tests/test_workflow_contract.py tests/test_quality_guards.py
