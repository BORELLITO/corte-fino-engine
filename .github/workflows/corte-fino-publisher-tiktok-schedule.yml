name: Corte Fino Motor 2 — TikTok Agendado

on:
  # O TikTok está roteado pelo Metricool temporariamente. Este workflow fica
  # manual apenas como lembrete operacional e não publica diretamente.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: corte-fino-motor-2
  cancel-in-progress: false

jobs:
  tiktok-scheduler:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Confirmar roteamento atual
        run: |
          echo "Publicação direta do TikTok está desativada no Publisher."
          echo "Agende os vídeos do TikTok pelo Metricool nesta fase."
          echo "O YouTube continua sendo publicado diretamente pelo Publisher."
