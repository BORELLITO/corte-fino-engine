name: Corte Fino Motor 2 — Publicar 5 por Dia

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "prepare, dry-run, browser-package, diagnostic-package ou preflight"
        required: true
        default: "dry-run"
        type: choice
        options: [dry-run, prepare, browser-package, diagnostic-package, preflight]
      folder_1:
        description: "URL/ID da primeira pasta com 5 MP4"
        required: true
        type: string
      folder_2:
        description: "URL/ID da segunda pasta com 5 MP4"
        required: true
        type: string
      date_1:
        description: "Data local da primeira pasta (AAAA-MM-DD)"
        required: true
        type: string
      date_2:
        description: "Data local da segunda pasta (AAAA-MM-DD)"
        required: true
        type: string
      period_1:
        description: "Grade da primeira pasta"
        required: true
        default: "daily"
        type: choice
        options: [daily]
      period_2:
        description: "Grade da segunda pasta"
        required: true
        default: "daily"
        type: choice
        options: [daily]
      source_name_1:
        description: "Canal/fonte original da primeira pasta"
        required: true
        type: string
      source_episode_1:
        description: "Episódio confirmado da primeira pasta"
        required: false
        default: ""
        type: string
      source_name_2:
        description: "Canal/fonte original da segunda pasta"
        required: true
        type: string
      source_episode_2:
        description: "Episódio confirmado da segunda pasta"
        required: false
        default: ""
        type: string
      youtube_account:
        description: "Canal/handle esperado no YouTube Studio"
        required: true
        default: "@cortefinoshorts"
        type: string
      tiktok_account:
        description: "Usuário esperado no TikTok Studio"
        required: true
        default: "cortefinoshorts"
        type: string
      rights_confirmed:
        description: "Confirme somente após revisar os direitos das duas fontes"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: corte-fino-publisher
  cancel-in-progress: false

jobs:
  publisher:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: "1"
      PUBLISHER_WHISPER_MODEL: small
      PUBLISHER_GOOGLE_CLIENT_ID: ${{ secrets.PUBLISHER_GOOGLE_CLIENT_ID }}
      PUBLISHER_GOOGLE_CLIENT_SECRET: ${{ secrets.PUBLISHER_GOOGLE_CLIENT_SECRET }}
      PUBLISHER_GOOGLE_REFRESH_TOKEN: ${{ secrets.PUBLISHER_GOOGLE_REFRESH_TOKEN }}
      # Publicação bloqueada por API. A etapa final ocorre manualmente no
      # YouTube Studio e no TikTok Studio pelo Cloud Web Browser.
      PUBLISHER_BROWSER_ONLY: "1"
      PUBLISHER_RIGHTS_AUTHORIZED: ${{ inputs.rights_confirmed && '1' || '0' }}
      PUBLISHER_RIGHTS_STATUS: "AUTORIZADO — confirmação manual das duas fontes"
      PUBLISHER_YOUTUBE_ACCOUNT: ${{ inputs.youtube_account }}
      PUBLISHER_TIKTOK_ACCOUNT: ${{ inputs.tiktok_account }}

    steps:
      - name: Guardar acionamento manual
        id: guard
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "O Publisher só aceita acionamento manual com duas pastas exatas." >&2
            exit 1
          fi
          echo "run=1" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Ferramentas de vídeo
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Cache Whisper
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: publisher-whisper-${{ runner.os }}-${{ env.PUBLISHER_WHISPER_MODEL }}
          restore-keys: publisher-whisper-${{ runner.os }}-

      - name: Testes completos
        run: python -m pytest -q

      - name: Estado da execução
        id: state
        run: echo "needs_prepare=1" >> "$GITHUB_OUTPUT"

      - name: Preparar manifesto v8
        id: prepare
        if: steps.state.outputs.needs_prepare == '1'
        run: |
          python -m publisher.cli prepare \
            --folder-id "${{ inputs.folder_1 }}" \
            --folder-2-id "${{ inputs.folder_2 }}" \
            --date-1 "${{ inputs.date_1 }}" \
            --date-2 "${{ inputs.date_2 }}" \
            --period-1 "${{ inputs.period_1 }}" \
            --period-2 "${{ inputs.period_2 }}" \
            --source-name "${{ inputs.source_name_1 }}" \
            --source-episode "${{ inputs.source_episode_1 }}" \
            --source-name-2 "${{ inputs.source_name_2 }}" \
            --source-episode-2 "${{ inputs.source_episode_2 }}" \
            --youtube-account "${{ inputs.youtube_account }}" \
            --tiktok-account "${{ inputs.tiktok_account }}" \
            ${{ inputs.rights_confirmed && '--confirm-rights' || '' }}

      - name: Dry-run YouTube
        if: inputs.mode == 'dry-run'
        run: python -m publisher.cli youtube --dry-run

      - name: Dry-run TikTok
        if: inputs.mode == 'dry-run'
        run: python -m publisher.cli tiktok --dry-run

      - name: Gerar pacote para o Cloud Web Browser
        if: inputs.mode == 'browser-package'
        run: python -m publisher.cli browser-package | tee publisher/state/browser_package.json

      - name: Gerar diagnóstico controlado de distribuição
        if: inputs.mode == 'diagnostic-package'
        run: python -m publisher.cli diagnostic-package | tee publisher/state/diagnostic_package.json

      - name: Inicializar ledger de publicação
        if: inputs.mode == 'browser-package' || inputs.mode == 'diagnostic-package'
        run: python -m publisher.cli init-ledger

      - name: Validar diagnóstico controlado
        if: inputs.mode == 'diagnostic-package'
        run: python - <<'PY'
          import json
          from pathlib import Path
          from publisher.cli import validate_browser_package
          package = json.loads(Path("publisher/state/diagnostic_package.json").read_text(encoding="utf-8"))
          validate_browser_package(package)
          assert package.get("mode") == "distribution_diagnostic"
          assert len(package.get("posts", [])) == 3
          PY

      - name: Preflight sem publicação
        if: inputs.mode == 'preflight'
        run: python -m publisher.cli browser-package > /dev/null

      - name: Verificar audiência pública TikTok
        if: inputs.mode == 'browser-package'
        run: python -m publisher.cli validate-browser-package

      - name: Relatório final
        if: always() && (steps.prepare.outcome == 'success' || steps.state.outputs.needs_prepare == '0') && inputs.mode != 'preflight'
        run: python -m publisher.cli report | tee publisher/state/report.json

      - name: Sanitizar estado operacional
        if: always() && (steps.prepare.outcome == 'success' || steps.state.outputs.needs_prepare == '0') && inputs.mode != 'preflight'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("publisher/state/current.json")
          if path.exists():
              data = json.loads(path.read_text(encoding="utf-8"))
              for clip in data.get("clips", []):
                  if isinstance(clip, dict):
                      clip.pop("transcript", None)
              data["transcripts"] = "redacted"
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Guardar estado como artefato temporário
        if: always() && (steps.prepare.outcome == 'success' || steps.state.outputs.needs_prepare == '0')
        uses: actions/upload-artifact@v4
        with:
          name: corte-fino-publisher-${{ github.run_id }}
          path: publisher/state/*.json
          if-no-files-found: warn
          retention-days: 1
