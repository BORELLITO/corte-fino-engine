name: Corte Fino Motor 2 — Publicar 10 Cortes

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "prepare, dry-run, browser-package ou preflight"
        required: true
        default: "dry-run"
        type: choice
        options: [dry-run, prepare, browser-package, preflight]
      folder_1:
        description: "URL/ID da primeira pasta com 5 MP4"
        required: true
        type: string
      folder_2:
        description: "URL/ID da segunda pasta com 5 MP4"
        required: true
        type: string
      date_1:
        description: "Data local da primeira pasta (AAAA-MM-DD)"
        required: true
        type: string
      date_2:
        description: "Data local da segunda pasta (AAAA-MM-DD)"
        required: true
        type: string
      period_1:
        description: "Período da primeira pasta"
        required: true
        default: "day"
        type: choice
        options: [day, night]
      period_2:
        description: "Período da segunda pasta"
        required: true
        default: "night"
        type: choice
        options: [day, night]
      source_name_1:
        description: "Canal/fonte original da primeira pasta"
        required: true
        type: string
      source_episode_1:
        description: "Episódio confirmado da primeira pasta"
        required: false
        default: ""
        type: string
      source_name_2:
        description: "Canal/fonte original da segunda pasta"
        required: true
        type: string
      source_episode_2:
        description: "Episódio confirmado da segunda pasta"
        required: false
        default: ""
        type: string
      rights_confirmed:
        description: "Confirme somente após revisar os direitos das duas fontes"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: corte-fino-publisher
  cancel-in-progress: false

jobs:
  publisher:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: "1"
      PUBLISHER_WHISPER_MODEL: small
      PUBLISHER_GOOGLE_CLIENT_ID: ${{ secrets.PUBLISHER_GOOGLE_CLIENT_ID }}
      PUBLISHER_GOOGLE_CLIENT_SECRET: ${{ secrets.PUBLISHER_GOOGLE_CLIENT_SECRET }}
      PUBLISHER_GOOGLE_REFRESH_TOKEN: ${{ secrets.PUBLISHER_GOOGLE_REFRESH_TOKEN }}
      # Publicação bloqueada por API. A etapa final ocorre manualmente no
      # YouTube Studio e no TikTok Studio pelo Cloud Web Browser.
      PUBLISHER_BROWSER_ONLY: "1"
      PUBLISHER_TIKTOK_DIRECT_ENABLED: "0"
      PUBLISHER_RIGHTS_AUTHORIZED: ${{ inputs.rights_confirmed && '1' || '0' }}
      PUBLISHER_RIGHTS_STATUS: "AUTORIZADO — confirmação manual das duas fontes"

    steps:
      - name: Guardar acionamento manual
        id: guard
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "O Publisher só aceita acionamento manual com duas pastas exatas." >&2
            exit 1
          fi
          echo "run=1" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Ferramentas de vídeo
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Cache Whisper
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: publisher-whisper-${{ runner.os }}-${{ env.PUBLISHER_WHISPER_MODEL }}
          restore-keys: publisher-whisper-${{ runner.os }}-

      - name: Testes completos
        run: python -m pytest -q

      - name: Verificar manifesto persistido
        id: state
        env:
          REQUESTED_FOLDER_1: ${{ inputs.folder_1 }}
          REQUESTED_FOLDER_2: ${{ inputs.folder_2 }}
          REQUESTED_DATE_1: ${{ inputs.date_1 }}
          REQUESTED_DATE_2: ${{ inputs.date_2 }}
          REQUESTED_PERIOD_1: ${{ inputs.period_1 }}
          REQUESTED_PERIOD_2: ${{ inputs.period_2 }}
          REQUESTED_SOURCE_1: ${{ inputs.source_name_1 }}
          REQUESTED_SOURCE_2: ${{ inputs.source_name_2 }}
          REQUESTED_MODE: ${{ inputs.mode }}
        run: |
          needs_prepare=1
          if [ -f publisher/state/current.json ]; then
            if python - <<'PY'
          import json
          import os
          from pathlib import Path
          from publisher.core import normalize_period, validate_manifest
          from publisher.google_io import normalize_folder_id

          try:
              data = json.loads(Path("publisher/state/current.json").read_text(encoding="utf-8"))
              validate_manifest(data)
              requested = [
                  (normalize_folder_id(os.environ["REQUESTED_FOLDER_1"]), os.environ["REQUESTED_DATE_1"], normalize_period(os.environ["REQUESTED_PERIOD_1"])),
                  (normalize_folder_id(os.environ["REQUESTED_FOLDER_2"]), os.environ["REQUESTED_DATE_2"], normalize_period(os.environ["REQUESTED_PERIOD_2"])),
              ]
              actual = [
                  (normalize_folder_id(str(item.get("drive_folder_id", ""))), str(item.get("date", "")), normalize_period(str(item.get("period", ""))))
                  for item in data.get("batches", [])
              ]
              requested_sources = [os.environ.get("REQUESTED_SOURCE_1", "").strip(), os.environ.get("REQUESTED_SOURCE_2", "").strip()]
              actual_sources = [str(item.get("source", {}).get("name", "")).strip() for item in data.get("batches", [])]
              if requested != actual or requested_sources != actual_sources:
                  raise SystemExit(1)
          except Exception:
              raise SystemExit(1)
          PY
            then
              if [ "${REQUESTED_MODE:-}" != "prepare" ]; then
                needs_prepare=0
              fi
            fi
          fi
          if [ "${{ inputs.mode }}" = "preflight" ]; then
            needs_prepare=0
          fi
          echo "needs_prepare=$needs_prepare" >> "$GITHUB_OUTPUT"

      - name: Preparar manifesto v6
        id: prepare
        if: steps.state.outputs.needs_prepare == '1' && inputs.mode != 'preflight'
        run: |
          python -m publisher.cli prepare \
            --folder-id "${{ inputs.folder_1 }}" \
            --folder-2-id "${{ inputs.folder_2 }}" \
            --date-1 "${{ inputs.date_1 }}" \
            --date-2 "${{ inputs.date_2 }}" \
            --period-1 "${{ inputs.period_1 }}" \
            --period-2 "${{ inputs.period_2 }}" \
            --source-name "${{ inputs.source_name_1 }}" \
            --source-episode "${{ inputs.source_episode_1 }}" \
            --source-name-2 "${{ inputs.source_name_2 }}" \
            --source-episode-2 "${{ inputs.source_episode_2 }}" \
            ${{ inputs.rights_confirmed && '--confirm-rights' || '' }}

      - name: Dry-run YouTube
        if: inputs.mode == 'dry-run'
        run: python -m publisher.cli youtube --dry-run

      - name: Dry-run TikTok
        if: inputs.mode == 'dry-run'
        run: python -m publisher.cli tiktok --dry-run

      - name: Gerar pacote para o Cloud Web Browser
        if: inputs.mode == 'browser-package'
        run: python -m publisher.cli browser-package | tee publisher/state/browser_package.json

      - name: Preflight sem publicação
        if: inputs.mode == 'preflight'
        run: python -m publisher.cli browser-package > /dev/null

      - name: Relatório final
        if: always() && (steps.prepare.outcome == 'success' || steps.state.outputs.needs_prepare == '0') && inputs.mode != 'preflight'
        run: python -m publisher.cli report | tee publisher/state/report.json

      - name: Guard de falhas parciais
        if: always() && (steps.prepare.outcome == 'success' || steps.state.outputs.needs_prepare == '0') && inputs.mode != 'preflight'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("publisher/state/report.json")
          if not path.exists():
              raise SystemExit(0)
          report = json.loads(path.read_text(encoding="utf-8"))
          attention = report.get("summary", {}).get("attention", 0)
          if attention:
              raise SystemExit(f"Publisher encontrou {attention} item(ns) para reconciliação.")
          PY

      - name: Persistir manifesto sanitizado
        if: always() && (steps.prepare.outcome == 'success' || steps.state.outputs.needs_prepare == '0') && inputs.mode != 'preflight'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("publisher/state/current.json")
          if path.exists():
              data = json.loads(path.read_text(encoding="utf-8"))
              for clip in data.get("clips", []):
                  if isinstance(clip, dict):
                      clip.pop("transcript", None)
              data["transcripts"] = "redacted"
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          git config user.name "corte-fino-publisher[bot]"
          git config user.email "corte-fino-publisher[bot]@users.noreply.github.com"
          git add publisher/state/current.json publisher/state/report.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(publisher): atualizar manifesto v6 da rodada"
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push; then
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              sleep $((attempt * 3))
            done
            echo "Não foi possível sincronizar o estado do Publisher." >&2
            exit 1
          fi

