name: Corte Fino Motor 0 — CI

# PAUSED 2026-10-28: Corte Fino on hold, restore via Git history.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    # Pause guard: manual dispatch does not run the engine.
    if: ${{ false }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install "pytest>=8,<9" "google-api-python-client>=2,<3" "google-auth>=2,<3" "youtube-transcript-api>=1,<2"
      - name: Testar Radar sem consumir API
        run: |
          python -m py_compile radar/corte_fino_radar.py radar/upload_reports_drive.py radar/drive_state.py
          python -m radar.drive_state --help >/dev/null
          python -m pytest -q tests/test_radar.py
