name: Corte Fino Motor 0 — Radar Viral

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Janela de busca em dias (1 a 14)"
        required: false
        default: "7"
      extra_topics:
        description: "Temas extras separados por vírgula"
        required: false
        default: ""
  schedule:
    # 08:30 e 20:30 no horário de Brasília (UTC-3).
    - cron: "30 11,23 * * *"

permissions:
  contents: read

concurrency:
  group: corte-fino-radar-viral
  cancel-in-progress: true

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar dependências leves
        run: |
          python -m pip install "pytest>=8,<9" "google-api-python-client>=2,<3" "google-auth>=2,<3"

      - name: Validar código do Radar
        run: |
          python -m py_compile radar/corte_fino_radar.py radar/upload_reports_drive.py radar/drive_state.py
          python -m pytest -q tests/test_radar.py

      - name: Preflight
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          DRIVE_FOLDER_ID: ${{ secrets.RADAR_DRIVE_FOLDER_ID || secrets.DRIVE_FOLDER_ID || secrets.DRIVER_FOLDER_ID || secrets.PUBLISHER_DRIVE_FOLDER_ID }}
        run: |
          missing=0
          for name in YOUTUBE_API_KEY GOOGLE_REFRESH_TOKEN GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET DRIVE_FOLDER_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name ausente."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 2; fi

      - name: Restaurar histórico de momentum do Drive
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          DRIVE_FOLDER_ID: ${{ secrets.RADAR_DRIVE_FOLDER_ID || secrets.DRIVE_FOLDER_ID || secrets.DRIVER_FOLDER_ID || secrets.PUBLISHER_DRIVE_FOLDER_ID }}
        run: python radar/drive_state.py pull

      - name: Executar Radar Viral
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          RADAR_DAYS: ${{ inputs.days || '7' }}
          RADAR_TOP_N: "5"
          RADAR_TREND_LIMIT: "6"
          RADAR_MAX_QUERIES: "18"
          RADAR_EXTRA_TOPICS: ${{ inputs.extra_topics || '' }}
          RADAR_STATE_FILE: "radar/state/history.json"
        run: >-
          python radar/corte_fino_radar.py
          --days "$RADAR_DAYS"
          --top-n "$RADAR_TOP_N"
          --trend-limit "$RADAR_TREND_LIMIT"
          --max-queries "$RADAR_MAX_QUERIES"
          --extra-topics "$RADAR_EXTRA_TOPICS"
          --state-file "$RADAR_STATE_FILE"

      - name: Enviar relatório ao Google Drive
        if: success()
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          DRIVE_FOLDER_ID: ${{ secrets.RADAR_DRIVE_FOLDER_ID || secrets.DRIVE_FOLDER_ID || secrets.DRIVER_FOLDER_ID || secrets.PUBLISHER_DRIVE_FOLDER_ID }}
        run: python radar/upload_reports_drive.py

      - name: Salvar histórico de momentum no Drive
        if: success()
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          DRIVE_FOLDER_ID: ${{ secrets.RADAR_DRIVE_FOLDER_ID || secrets.DRIVE_FOLDER_ID || secrets.DRIVER_FOLDER_ID || secrets.PUBLISHER_DRIVE_FOLDER_ID }}
        run: python radar/drive_state.py push

      - name: Resumo seguro
        if: success()
        run: |
          echo "## 🎯 Corte Fino — Radar Viral V2.1" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Varredura concluída e relatório enviado para a pasta privada RADAR_CORTE_FINO no Google Drive." >> "$GITHUB_STEP_SUMMARY"
          echo "Nenhum ranking editorial completo é publicado no GitHub." >> "$GITHUB_STEP_SUMMARY"
