name: Corte Fino Diário

on:
  schedule:
    - cron: "15 22 * * *"

  workflow_dispatch:
    inputs:
      source_url:
        description: "Link autorizado do vídeo"
        required: false
        type: string

permissions:
  contents: read

jobs:
  gerar-cortes:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Instalar Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          pip install google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib

      - name: Gerar cortes
        env:
          SOURCE_URL: ${{ inputs.source_url }}
        run: |
          sed -i 's/parents\[1\]/parent/' main.py
          python main.py

      - name: Enviar resultados para o Google Drive
        if: always()
        continue-on-error: true
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: |
          python - <<'PY'
          import mimetypes
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          from google.auth.transport.requests import Request
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.errors import HttpError
          from googleapiclient.http import MediaFileUpload

          raw_folder_id = os.environ.get("DRIVE_FOLDER_ID", "").strip()
          if "/folders/" in raw_folder_id:
              raw_folder_id = raw_folder_id.split("/folders/", 1)[1]
              raw_folder_id = raw_folder_id.split("?", 1)[0].split("/", 1)[0].strip()
          folder_id = raw_folder_id if raw_folder_id not in {"", ".", ".."} else ""

          credentials = Credentials(
              token=None,
              refresh_token=os.environ["GOOGLE_REFRESH_TOKEN"],
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ["GOOGLE_CLIENT_ID"],
              client_secret=os.environ["GOOGLE_CLIENT_SECRET"],
              scopes=["https://www.googleapis.com/auth/drive"],
          )

          credentials.refresh(Request())
          drive = build(
              "drive",
              "v3",
              credentials=credentials,
              cache_discovery=False,
          )

          folder = None
          if folder_id:
              try:
                  folder = drive.files().get(
                      fileId=folder_id,
                      fields="id,name,mimeType,trashed",
                  ).execute()
                  if (
                      folder.get("mimeType")
                      != "application/vnd.google-apps.folder"
                      or folder.get("trashed")
                  ):
                      folder = None
              except HttpError as exc:
                  if exc.resp.status != 404:
                      raise
                  folder = None

          if folder is None:
              folder = drive.files().create(
                  body={
                      "name": "Corte Fino — Vídeos Prontos",
                      "mimeType": "application/vnd.google-apps.folder",
                  },
                  fields="id,name",
              ).execute()
              print(
                  f"Pasta criada no Drive: https://drive.google.com/drive/folders/{folder['id']}"
              )

          folder_id = folder["id"]
          print(f"Pasta de destino: {folder.get('name', folder_id)}")

          output = Path("output")
          files = sorted((output / "clips").glob("*.mp4"))
          files += [
              output / "relatorio.md",
              output / "relatorio.json",
              output / "corte-fino-resultados.zip",
          ]

          timestamp = datetime.now(timezone.utc).strftime("%Y%m%dT%H%M%SZ")
          enviados = []

          for file_path in files:
              if not file_path.exists():
                  continue

              mime_type = (
                  mimetypes.guess_type(file_path.name)[0]
                  or "application/octet-stream"
              )

              metadata = {
                  "name": f"{timestamp}_{file_path.name}",
                  "parents": [folder_id],
              }

              media = MediaFileUpload(
                  str(file_path),
                  mimetype=mime_type,
                  resumable=True,
              )

              result = drive.files().create(
                  body=metadata,
                  media_body=media,
                  fields="id,name,webViewLink",
              ).execute()

              enviados.append(result)
              print(f"Enviado: {result.get('name')}")

          print(f"Total enviado ao Drive: {len(enviados)} arquivo(s).")
          PY

      - name: Salvar artefatos do GitHub
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corte-fino-resultados
          path: output/
          retention-days: 7
