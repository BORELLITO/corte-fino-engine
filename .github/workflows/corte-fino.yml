name: Corte Fino Diário

on:
  schedule:
    # 22:15 UTC ≈ 19:15 no horário de Brasília.
    - cron: "15 22 * * *"

  # Entradas manuais usam texto para evitar a falha 500 do formulário de dispatch.
  # O motor continua tratando direitos como revisão manual e mantendo o Top 5 fechado.
  workflow_dispatch:
    inputs:
      source_url:
        description: "Link do vídeo para teste (direitos sob responsabilidade do usuário)"
        required: false
        default: ""
        type: string
      rights_confirmed:
        description: "Opcional: digite true somente se a revisão de direitos foi feita"
        required: false
        default: "false"
        type: string
      force_top_five:
        description: "Digite true para forçar os 5 melhores cortes disponíveis"
        required: false
        default: "true"
        type: string

permissions:
  contents: write

concurrency:
  # Um único lock para evitar duas rodadas disputando a mesma entrada do Drive.
  group: corte-fino-producao
  cancel-in-progress: false

jobs:
  gerar-cortes:
    runs-on: ubuntu-22.04
    timeout-minutes: 330
    env:
      # O usuário é responsável pelas licenças; o workflow apenas edita e entrega os arquivos.
      ALLOW_UNVERIFIED_SOURCE: "1"
      WHISPER_MODEL: small
      WHISPER_MODEL_CACHE: ~/.cache/faster-whisper
      MAX_SOURCE_DURATION_SECONDS: 21600
      PYTHONUNBUFFERED: "1"
      TRANSCRIBE_BEAM_SIZE: "3"
      TRANSCRIBE_CPU_THREADS: "4"
      VIDEO_CRF: "18"
      VIDEO_PRESET: medium
      VIDEO_AUDIO_BITRATE: 192k
      USE_EDITORIAL_SCORE_GATE: "0"
      REQUIRE_EXACT_TOP_FIVE: "1"
      CAPTION_MIN_WORD_PROBABILITY: "0.40"
      CAPTION_LOW_CONFIDENCE_FATAL: "1"
      CAPTION_SPELLING_MIN_ZIPF: "2.30"
      CAPTION_HARD_MAX_CPS: "24.0"
      FORCE_TOP_FIVE: ${{ inputs.force_top_five == 'true' && '1' || '0' }}

    steps:
      - name: Baixar código
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validar guards do motor
        run: python -m pytest -q tests/test_quality_guards.py

      - name: Preparar cache do Whisper
        uses: actions/cache@v6
        with:
          path: ~/.cache/faster-whisper
          key: faster-whisper-${{ runner.os }}-${{ env.WHISPER_MODEL }}
          restore-keys: |
            faster-whisper-${{ runner.os }}-

      - name: Configurar acesso opcional ao YouTube
        env:
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
        run: |
          if [ -z "$YOUTUBE_COOKIES_B64" ]; then
            echo "Nenhum cookie do YouTube configurado; seguindo com acesso público."
          else
            printf '%s' "$YOUTUBE_COOKIES_B64" | base64 --decode > "$RUNNER_TEMP/youtube-cookies.txt"
            chmod 600 "$RUNNER_TEMP/youtube-cookies.txt"
            echo "YOUTUBE_COOKIEFILE=$RUNNER_TEMP/youtube-cookies.txt" >> "$GITHUB_ENV"
            echo "Cookies do YouTube configurados com segurança."
          fi

      - name: Definir link manual, quando informado
        if: ${{ inputs.source_url != '' }}
        env:
          MANUAL_SOURCE_URL: ${{ inputs.source_url }}
        run: |
          echo "SOURCE_URL=$MANUAL_SOURCE_URL" >> "$GITHUB_ENV"
          if [ "${{ inputs.rights_confirmed }}" = "true" ]; then
            echo "SOURCE_RIGHTS_STATUS=AUTORIZADO — confirmação manual do proprietário/licenciante" >> "$GITHUB_ENV"
          fi

      - name: Validar acesso ao Google Drive antes do processamento
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          DRIVE_SOURCE_FOLDER_ID: ${{ secrets.DRIVE_SOURCE_FOLDER_ID }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          MANUAL_SOURCE_URL: ${{ inputs.source_url }}
        run: |
          python - <<'PY'
          import os

          from google.auth.transport.requests import Request
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.errors import HttpError

          def folder_id(value):
              value = (value or "").strip()
              if "/folders/" in value:
                  value = value.split("/folders/", 1)[1].split("?", 1)[0].split("/", 1)[0].strip()
              return value

          def validate_folder(drive, raw_value, label, require_write=False):
              value = folder_id(raw_value)
              if not value or value in {".", ".."}:
                  raise SystemExit(f"{label} não está configurado.")
              try:
                  item = drive.files().get(
                      fileId=value,
                      fields="id,name,mimeType,trashed,capabilities(canAddChildren)",
                  ).execute()
              except HttpError as exc:
                  status = getattr(getattr(exc, "resp", None), "status", "desconhecido")
                  raise SystemExit(
                      f"{label} está inválido ou inacessível (HTTP {status}). "
                      "Confira o secret e a pasta compartilhada com a conta do OAuth."
                  ) from exc
              if item.get("mimeType") != "application/vnd.google-apps.folder":
                  raise SystemExit(f"{label} não aponta para uma pasta do Google Drive.")
              if item.get("trashed"):
                  raise SystemExit(f"{label} aponta para uma pasta na lixeira.")
              if require_write and item.get("capabilities", {}).get("canAddChildren") is False:
                  raise SystemExit(f"{label} está acessível, mas a conta não pode fazer upload nela.")
              print(f"{label}: OK — {item.get('name', value)}")

          required = ["GOOGLE_REFRESH_TOKEN", "GOOGLE_CLIENT_ID", "GOOGLE_CLIENT_SECRET", "DRIVE_FOLDER_ID"]
          missing = [name for name in required if not os.environ.get(name, "").strip()]
          if missing:
              raise SystemExit("Secrets ausentes: " + ", ".join(missing))

          credentials = Credentials(
              token=None,
              refresh_token=os.environ["GOOGLE_REFRESH_TOKEN"],
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ["GOOGLE_CLIENT_ID"],
              client_secret=os.environ["GOOGLE_CLIENT_SECRET"],
              scopes=["https://www.googleapis.com/auth/drive"],
          )
          try:
              credentials.refresh(Request())
              drive = build("drive", "v3", credentials=credentials, cache_discovery=False)
              validate_folder(drive, os.environ["DRIVE_FOLDER_ID"], "DRIVE_FOLDER_ID", require_write=True)
              if not os.environ.get("MANUAL_SOURCE_URL", "").strip():
                  validate_folder(drive, os.environ.get("DRIVE_SOURCE_FOLDER_ID"), "DRIVE_SOURCE_FOLDER_ID")
          except SystemExit:
              raise
          except Exception as exc:
              raise SystemExit(
                  "Não foi possível autenticar no Google Drive. "
                  "Confira GOOGLE_REFRESH_TOKEN, GOOGLE_CLIENT_ID e GOOGLE_CLIENT_SECRET."
              ) from exc

          print("Preflight do Google Drive concluído; o processamento pode começar.")
          PY



      - name: Buscar entrada no Drive
        id: drive_source
        if: ${{ inputs.source_url == '' }}
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          DRIVE_SOURCE_FOLDER_ID: ${{ secrets.DRIVE_SOURCE_FOLDER_ID }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          from google.auth.transport.requests import Request
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaIoBaseDownload

          folder_id = os.environ.get("DRIVE_SOURCE_FOLDER_ID", "").strip()
          if "/folders/" in folder_id:
              folder_id = folder_id.split("/folders/", 1)[1].split("?", 1)[0].split("/", 1)[0].strip()
          if not folder_id or folder_id in {".", ".."}:
              raise SystemExit("DRIVE_SOURCE_FOLDER_ID não está configurado.")

          credentials = Credentials(
              token=None,
              refresh_token=os.environ["GOOGLE_REFRESH_TOKEN"],
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ["GOOGLE_CLIENT_ID"],
              client_secret=os.environ["GOOGLE_CLIENT_SECRET"],
              scopes=["https://www.googleapis.com/auth/drive"],
          )
          credentials.refresh(Request())
          drive = build("drive", "v3", credentials=credentials, cache_discovery=False)

          query = f"'{folder_id}' in parents and trashed = false and mimeType contains 'video/'"
          result = drive.files().list(
              q=query,
              orderBy="modifiedTime desc",
              pageSize=20,
              fields="files(id,name,mimeType,modifiedTime,webViewLink)",
          ).execute()
          files = result.get("files", [])
          if not files:
              print("Nenhum vídeo novo; rodada encerrada sem cortes."); open(os.environ["GITHUB_ENV"], "a", encoding="utf-8").write("NO_SOURCE=1\n"); raise SystemExit(0)

          chosen = files[0]
          target = Path(os.environ["RUNNER_TEMP"]) / "corte-fino-authorized-source.mp4"
          request = drive.files().get_media(fileId=chosen["id"])
          with target.open("wb") as handle:
              downloader = MediaIoBaseDownload(handle, request)
              done = False
              while not done:
                  _, done = downloader.next_chunk()

          web_url = chosen.get("webViewLink") or f"https://drive.google.com/file/d/{chosen['id']}/view"
          def write_command_file(path, name, value):
              delimiter = "CORTEFINO_" + str(abs(hash((name, value))))
              with open(path, "a", encoding="utf-8") as handle:
                  handle.write(f"{name}<<{delimiter}\n{value}\n{delimiter}\n")

          for name, value in {
              "SOURCE_FILE": str(target),
              "SOURCE_URL": web_url,
              "SOURCE_WEB_URL": web_url,
              "SOURCE_TITLE": chosen["name"],
              "SOURCE_CHANNEL": "Entrada do Google Drive",
              "SOURCE_RIGHTS_STATUS": "REVISÃO MANUAL — licença sob responsabilidade do usuário",
              "DRIVE_SOURCE_FILE_ID": chosen["id"],
              "DRIVE_SOURCE_FILE_NAME": chosen["name"],
          }.items():
              write_command_file(os.environ["GITHUB_ENV"], name, value)
          write_command_file(os.environ["GITHUB_OUTPUT"], "file_id", chosen["id"])
          write_command_file(os.environ["GITHUB_OUTPUT"], "file_name", chosen["name"])
          print(f"Vídeo selecionado: {chosen['name']}")
          print(f"Arquivo baixado para: {target}")
          PY

      - name: Gerar cortes
        id: generate_cuts
        run: |
          if [ "${NO_SOURCE:-0}" = "1" ]; then echo "Nenhum vídeo novo; nada a processar nesta rodada."; elif [ -n "$SOURCE_FILE" ]; then
            python - <<'PY'
          import json
          import os
          from pathlib import Path
          import main
          
          def local_download(_url):
              source = Path(os.environ["SOURCE_FILE"])
              if not source.is_file():
                  raise FileNotFoundError(f"Fonte local não encontrada: {source}")
              info = {
                  "title": os.environ.get("SOURCE_TITLE", source.name),
                  "channel": os.environ.get("SOURCE_CHANNEL", "Entrada do Google Drive"),
                  "webpage_url": os.environ.get("SOURCE_WEB_URL", ""),
              }
              return source, info
          
          main.download_source = local_download
          code = main.main()
          report = Path("output/relatorio.json")
          if report.exists():
              data = json.loads(report.read_text(encoding="utf-8"))
              status = data.get("status", "")
              if status == "EDITORIAL_EMPTY":
                  with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
                      env_file.write("EDITORIAL_EMPTY=1\n")
              elif data.get("error"):
                  code = 1
              elif status != "READY_FOR_HUMAN_REVIEW" or not data.get("clips"):
                  print(f"Gate de prontidão reprovado: status={status!r}")
                  code = 1
              else:
                  rendered_qa = [
                      item for item in data.get("qa", [])
                      if item.get("stage") == "rendered_clip"
                  ]
                  if (
                      len(data.get("clips", [])) != 5
                      or len(rendered_qa) != 5
                      or not all(item.get("passed") for item in rendered_qa)
                  ):
                      print("Gate de prontidão reprovado: a rodada não tem 5 vídeos aprovados.")
                      code = 1
                  else:
                      with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
                          env_file.write("PROCESSING_READY=1\n")
          raise SystemExit(code)
          PY
          else
            python main.py
          fi

      - name: Enviar 5 vídeos para o Google Drive
        id: upload_drive
        if: ${{ steps.generate_cuts.outcome == 'success' && env.NO_SOURCE != '1' && env.EDITORIAL_EMPTY != '1' && env.PROCESSING_READY == '1' }}
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: |
          python - <<'PY'
          import json
          import hashlib
          import mimetypes
          import os
          import re
          from pathlib import Path

          from google.auth.transport.requests import Request
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.errors import HttpError
          from googleapiclient.http import MediaFileUpload

          FOLDER_MIME = "application/vnd.google-apps.folder"
          DRIVE_RETRIES = 4

          def execute(request):
              return request.execute(num_retries=DRIVE_RETRIES)

          def file_md5(path):
              digest = hashlib.md5()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          def folder_id(value):
              value = (value or "").strip()
              if "/folders/" in value:
                  value = value.split("/folders/", 1)[1].split("?", 1)[0].split("/", 1)[0].strip()
              return value

          def clean_display_name(value, fallback):
              value = re.sub(r"[\\/:*?\"<>|\x00-\x1f]+", "-", str(value or ""))
              value = re.sub(r"\s+", " ", value).strip(" .-")
              return (value[:120] or fallback)

          def list_all(drive, query, fields):
              items = []
              page_token = None
              while True:
                  kwargs = {
                      "q": query,
                      "pageSize": 100,
                      "fields": f"nextPageToken,files({fields})",
                  }
                  if page_token:
                      kwargs["pageToken"] = page_token
                  result = execute(drive.files().list(**kwargs))
                  items.extend(result.get("files", []))
                  page_token = result.get("nextPageToken")
                  if not page_token:
                      return items

          def find_child(drive, parent_id, name):
              escaped = name.replace("'", "\\'")
              query = f"'{parent_id}' in parents and trashed = false and name = '{escaped}'"
              return list_all(
                  drive,
                  query,
                  "id,name,mimeType,size,md5Checksum,webViewLink,parents",
              )

          def get_or_create_folder(drive, parent_id, name):
              matches = find_child(drive, parent_id, name)
              if len(matches) > 1:
                  raise RuntimeError(f"Duplicidade detectada no Drive para a pasta da rodada: {name}")
              folders = [item for item in matches if item.get("mimeType") == FOLDER_MIME]
              if folders:
                  return folders[0]
              if matches:
                  raise RuntimeError(f"Já existe um arquivo com o nome da pasta da rodada: {name}")
              return execute(drive.files().create(
                  body={"name": name, "mimeType": FOLDER_MIME, "parents": [parent_id]},
                  fields="id,name,webViewLink",
              ))

          def upload_idempotent(drive, path, parent_id, name):
              matches = find_child(drive, parent_id, name)
              if len(matches) > 1:
                  raise RuntimeError(f"Duplicidade detectada no Drive para {name}")
              media = MediaFileUpload(
                  str(path),
                  mimetype=mimetypes.guess_type(name)[0] or "application/octet-stream",
                  resumable=True,
              )
              if matches:
                  item = execute(drive.files().update(
                      fileId=matches[0]["id"],
                      media_body=media,
                      fields="id,name,mimeType,size,md5Checksum,webViewLink,parents",
                  ))
              else:
                  item = execute(drive.files().create(
                      body={"name": name, "parents": [parent_id]},
                      media_body=media,
                      fields="id,name,mimeType,size,md5Checksum,webViewLink,parents",
                  ))
              verified = execute(drive.files().get(
                  fileId=item["id"],
                  fields="id,name,mimeType,size,md5Checksum,webViewLink,parents,trashed",
              ))
              expected_mime = mimetypes.guess_type(name)[0] or "application/octet-stream"
              if verified.get("trashed") or int(verified.get("size") or 0) <= 0:
                  raise RuntimeError(f"Upload não verificável para {name}")
              if verified.get("mimeType") != expected_mime:
                  raise RuntimeError(
                      f"Tipo MIME inesperado para {name}: {verified.get('mimeType')} != {expected_mime}"
                  )
              remote_md5 = verified.get("md5Checksum")
              if remote_md5 and remote_md5 != file_md5(path):
                  raise RuntimeError(f"Checksum divergente após upload para {name}")
              return verified

          raw_parent = folder_id(os.environ.get("DRIVE_FOLDER_ID"))
          if not raw_parent:
              raise SystemExit("DRIVE_FOLDER_ID não está configurado; nenhum destino alternativo será criado.")

          credentials = Credentials(
              token=None,
              refresh_token=os.environ["GOOGLE_REFRESH_TOKEN"],
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ["GOOGLE_CLIENT_ID"],
              client_secret=os.environ["GOOGLE_CLIENT_SECRET"],
              scopes=["https://www.googleapis.com/auth/drive"],
          )
          credentials.refresh(Request())
          drive = build("drive", "v3", credentials=credentials, cache_discovery=False)

          try:
              parent = drive.files().get(
                  fileId=raw_parent,
                  fields="id,name,mimeType,trashed,capabilities(canAddChildren)",
              ).execute(num_retries=DRIVE_RETRIES)
          except HttpError as exc:
              raise RuntimeError(f"DRIVE_FOLDER_ID inválido ou inacessível: {raw_parent}") from exc
          if parent.get("mimeType") != FOLDER_MIME or parent.get("trashed"):
              raise RuntimeError("DRIVE_FOLDER_ID não aponta para uma pasta ativa.")
          if parent.get("capabilities", {}).get("canAddChildren") is False:
              raise RuntimeError("A conta não pode fazer upload em DRIVE_FOLDER_ID.")

          report = json.loads(Path("output/relatorio.json").read_text(encoding="utf-8"))
          clips = report.get("clips", [])
          if len(clips) != 5:
              raise RuntimeError(f"Entrega bloqueada: esperados 5 cortes, encontrados {len(clips)}.")

          source_meta = report.get("source") or {}
          source_title = clean_display_name(
              Path(str(source_meta.get("title") or os.environ.get("SOURCE_TITLE") or "fonte")).stem,
              "fonte autorizada",
          )
          source_hash = str(source_meta.get("fingerprint_sha256") or "").strip().lower()
          if not source_hash:
              raise RuntimeError("Entrega bloqueada: fingerprint da fonte ausente.")
          batch_name = f"{source_hash[:12]} - {source_title}"
          batch = get_or_create_folder(drive, raw_parent, batch_name)

          expected = []
          local_videos = []
          for index, clip in enumerate(clips, 1):
              video_path = Path("output") / clip["file"]
              if not video_path.is_file():
                  raise RuntimeError(f"Vídeo ausente no corte {index:02d}.")
              video_name = f"{source_title} - {index:02d}.mp4"
              expected.append(video_name)
              local_videos.append((video_path, video_name))

          children = list_all(
              drive,
              f"'{batch['id']}' in parents and trashed = false",
              "id,name,mimeType,size,md5Checksum,webViewLink,parents",
          )
          unexpected = sorted(
              item.get("name", "")
              for item in children
              if item.get("name") not in expected
          )
          if unexpected:
              raise RuntimeError(
                  "A pasta da rodada já contém arquivos fora do contrato; "
                  "nenhum arquivo foi removido: " + ", ".join(unexpected)
              )

          for video_path, video_name in local_videos:
              upload_idempotent(drive, video_path, batch["id"], video_name)

          final_children = list_all(
              drive,
              f"'{batch['id']}' in parents and trashed = false",
              "id,name,mimeType,size,md5Checksum,webViewLink,parents",
          )
          by_name = {item.get("name"): item for item in final_children}
          missing = [name for name in expected if name not in by_name]
          if missing or len(final_children) != 5 or len(by_name) != 5:
              raise RuntimeError(
                  f"Verificação final falhou: arquivos={len(final_children)}, ausentes={missing}"
              )
          if any(int(by_name[name].get("size") or 0) <= 0 for name in expected):
              raise RuntimeError("Verificação final falhou: existe arquivo vazio.")
          if any(
              by_name[name].get("mimeType") != "video/mp4"
              for name in expected
          ):
              raise RuntimeError("Verificação final falhou: tipo MIME incompatível com o nome do arquivo.")
          manifest = {
              "batch_folder_id": batch["id"],
              "batch_folder": batch.get("webViewLink") or f"https://drive.google.com/drive/folders/{batch['id']}",
              "source_fingerprint_sha256": source_hash,
              "source_title": source_title,
              "file_count": 5,
              "files": [
                  {"name": name, "id": by_name[name]["id"], "webViewLink": by_name[name].get("webViewLink")}
                  for name in expected
              ],
          }
          Path("output/drive_manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          print(f"Pasta da rodada: {manifest['batch_folder']}")
          print("Entrega verificada: 5 MP4, sem subpastas e sem arquivos extras.")
          for item in manifest["files"]:
              print(f"{item['name']}: {item['webViewLink']}")
          PY

      - name: Registrar lote exato do Publisher
        if: ${{ steps.upload_drive.outcome == 'success' && env.PROCESSING_READY == '1' }}
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          source = Path("output/drive_manifest.json")
          if not source.exists():
              raise SystemExit("Manifesto do lote não encontrado; Publisher não será ativado.")
          manifest = json.loads(source.read_text(encoding="utf-8"))
          folder_id = str(manifest.get("batch_folder_id") or "").strip()
          folder_url = str(manifest.get("batch_folder") or "").strip()
          if not folder_id or not folder_url or len(manifest.get("files", [])) != 5:
              raise SystemExit("Manifesto do lote não contém a pasta exata e os cinco arquivos.")
          pointer = {
              "version": 1,
              "batch_folder_id": folder_id,
              "batch_folder": folder_url,
              "source_fingerprint_sha256": manifest.get("source_fingerprint_sha256", ""),
              "source_title": manifest.get("source_title", ""),
              "files": manifest.get("files", []),
              "updated_at_utc": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
          }
          target = Path("publisher/state/latest_batch.json")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps(pointer, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          git config user.name "corte-fino-generator[bot]"
          git config user.email "corte-fino-generator[bot]@users.noreply.github.com"
          git add publisher/state/latest_batch.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(generator): registrar lote exato do publisher"
            git push
          fi

      - name: Marcar entrada como processada
        if: ${{ steps.generate_cuts.outcome == 'success' && steps.upload_drive.outcome == 'success' && steps.drive_source.outputs.file_id != '' && env.EDITORIAL_EMPTY != '1' && env.PROCESSING_READY == '1' && success() }}
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          DRIVE_SOURCE_FOLDER_ID: ${{ secrets.DRIVE_SOURCE_FOLDER_ID }}
          DRIVE_SOURCE_FILE_ID: ${{ steps.drive_source.outputs.file_id }}
          DRIVE_SOURCE_FILE_NAME: ${{ steps.drive_source.outputs.file_name }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timezone

          from google.auth.transport.requests import Request
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build

          folder_id = os.environ["DRIVE_SOURCE_FOLDER_ID"].strip()
          if "/folders/" in folder_id:
              folder_id = folder_id.split("/folders/", 1)[1].split("?", 1)[0].split("/", 1)[0].strip()
          credentials = Credentials(
              token=None,
              refresh_token=os.environ["GOOGLE_REFRESH_TOKEN"],
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ["GOOGLE_CLIENT_ID"],
              client_secret=os.environ["GOOGLE_CLIENT_SECRET"],
              scopes=["https://www.googleapis.com/auth/drive"],
          )
          credentials.refresh(Request())
          drive = build("drive", "v3", credentials=credentials, cache_discovery=False)
          query = (
              f"'{folder_id}' in parents and trashed = false and "
              "mimeType = 'application/vnd.google-apps.folder' and name = 'Processados'"
          )
          folders = drive.files().list(q=query, pageSize=1, fields="files(id,name)").execute().get("files", [])
          processed_folder = folders[0] if folders else drive.files().create(
              body={"name": "Processados", "mimeType": "application/vnd.google-apps.folder", "parents": [folder_id]},
              fields="id,name",
          ).execute()
          stamp = datetime.now(timezone.utc).strftime("%Y%m%dT%H%M%SZ")
          old_name = os.environ.get("DRIVE_SOURCE_FILE_NAME", "fonte.mp4")
          new_name = f"processado_{stamp}_{old_name}"
          drive.files().update(
              fileId=os.environ["DRIVE_SOURCE_FILE_ID"],
              addParents=processed_folder["id"],
              removeParents=folder_id,
              body={"name": new_name},
              fields="id,name,parents",
          ).execute()
          print(f"Entrada marcada como processada: {new_name}")
          PY

      - name: Salvar artefatos do GitHub
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: corte-fino-resultados
          path: output/clips/
          if-no-files-found: ignore
          retention-days: 7


