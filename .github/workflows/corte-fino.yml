name: Corte Fino Diário

on:
  schedule:
    - cron: "15 22 * * *"
  workflow_dispatch:
    inputs:
      source_url:
        description: "Link autorizado do vídeo"
        required: false
        type: string

permissions:
  contents: read

jobs:
  gerar-cortes:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Gerar cortes
        env:
          SOURCE_URL: ${{ inputs.source_url }}
        run: |
          sed -i 's/parents\[1\]/parent/' main.py
          python main.py

      - name: Baixar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corte-fino-resultados
          path: output/
          retention-days: 7
