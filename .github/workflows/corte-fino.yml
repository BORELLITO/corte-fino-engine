name: Corte Fino Motor 1 — Gerar 5 Cortes

on:
  # Entradas manuais usam texto para evitar a falha 500 do formulário de dispatch.
  # O motor continua tratando direitos como revisão manual e mantendo o Top 5 fechado.
  workflow_dispatch:
    inputs:
      source_url:
        description: "Link do vídeo para teste (direitos sob responsabilidade do usuário)"
        required: false
        default: ""
        type: string
      rights_confirmed:
        description: "Opcional: digite true somente se a revisão de direitos foi feita"
        required: false
        default: "false"
        type: string
      force_top_five:
        description: "Digite true para forçar os 5 melhores cortes disponíveis"
        required: false
        default: "true"
        type: string

permissions:
  contents: write

concurrency:
  # Uma rodada do Motor 1 não bloqueia o Motor 2; só evita duas gerações
  # concorrentes disputando a mesma pasta de entrada.
  group: corte-fino-motor-1
  cancel-in-progress: false

jobs:
