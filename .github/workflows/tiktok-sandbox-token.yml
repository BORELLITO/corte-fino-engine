name: TikTok Sandbox — trocar código por refresh token

on:
  workflow_dispatch:
    inputs:
      authorization_code:
        description: "Código temporário exibido pela página de callback"
        required: true
        type: string

permissions:
  contents: read

jobs:
  exchange:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    env:
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_SANDBOX_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_SANDBOX_CLIENT_SECRET }}
      TIKTOK_AUTHORIZATION_CODE: ${{ inputs.authorization_code }}
      TIKTOK_REDIRECT_URI: https://borellito.github.io/corte-fino-engine/tiktok-callback/
    steps:
      - name: Trocar código por token
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          form = urllib.parse.urlencode({
              "client_key": os.environ["TIKTOK_CLIENT_KEY"],
              "client_secret": os.environ["TIKTOK_CLIENT_SECRET"],
              "code": os.environ["TIKTOK_AUTHORIZATION_CODE"],
              "grant_type": "authorization_code",
              "redirect_uri": os.environ["TIKTOK_REDIRECT_URI"],
          }).encode()
          request = urllib.request.Request(
              "https://open.tiktokapis.com/v2/oauth/token/",
              data=form,
              headers={"Content-Type": "application/x-www-form-urlencoded"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=60) as response:
                  result = json.loads(response.read().decode())
          except urllib.error.HTTPError as exc:
              detail = exc.read().decode("utf-8", errors="replace")
              raise SystemExit(f"TikTok recusou a troca do código: HTTP {exc.code} — {detail[:500]}")
          if result.get("error"):
              raise SystemExit(f"TikTok recusou a troca do código: {result}")
          refresh = result.get("refresh_token", "")
          if not refresh:
              raise SystemExit("TikTok não retornou refresh_token.")
          output = Path(os.environ["RUNNER_TEMP"]) / "tiktok-sandbox-refresh-token.txt"
          output.write_text(refresh + "\n", encoding="utf-8")
          print("Refresh token criado. Ele foi colocado apenas no artefato protegido.")
          PY

      - name: Disponibilizar token como artefato protegido
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-sandbox-refresh-token
          path: ${{ runner.temp }}/tiktok-sandbox-refresh-token.txt
          retention-days: 1
