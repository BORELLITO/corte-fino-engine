name: Verbo no Chão — Eight Specialist Audits

on:
  push:
    branches:
      - "verbo-no-chao/**"
  pull_request:
    branches:
      - "verbo-no-chao/bootstrap"

permissions:
  contents: read

jobs:
  editorial_production:
    name: Produce editorial strategy and 90-day briefs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Produce review-only strategy and content plan
        run: python -m agents.content_production --root . --output-dir .
      - name: Preserve actual editorial deliverables
        uses: actions/upload-artifact@v4
        with:
          name: vnc-editorial-deliverables
          path: |
            operations/*.json
            editorial-deliveries/*.md
            editorial-deliveries/*.json
          if-no-files-found: error
          retention-days: 14

  script_production:
    name: Generate 3 context-grounded script drafts
    needs: editorial_production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Retrieve validated 90-day editorial plan
        uses: actions/download-artifact@v4
        with:
          name: vnc-editorial-deliverables
          path: .
      - name: Generate and validate original script drafts
        run: python -m agents.first_batch_production --root . --output-dir .
      - name: Preserve actual review-only script drafts
        uses: actions/upload-artifact@v4
        with:
          name: vnc-first-batch-scripts
          path: |
            operations/first_batch_scripts.json
            editorial-deliveries/first_batch_scripts.md
            editorial-deliveries/first_batch_report.json
          if-no-files-found: error
          retention-days: 14

  audio_preflight:
    name: Blocked-by-design audio readiness evidence
    needs: script_production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download three canonical script drafts
        uses: actions/download-artifact@v4
        with:
          name: vnc-first-batch-scripts
          path: .
      - name: Generate proof-linked audio preflight, not WAV
        run: python -m agents.audio_preflight --root . --upstream-dir . --output-dir .
      - name: Preserve explicit blocked status and supporting evidence
        uses: actions/upload-artifact@v4
        with:
          name: vnc-audio-preflight
          path: audio-preflight/
          if-no-files-found: error
          retention-days: 14

  specialists:
    name: Audit — ${{ matrix.agent }}
    needs: [editorial_production, script_production]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        agent:
          - niche_strategy
          - growth_90d
          - idea_research
          - retention_script
          - titles_covers
          - shorts_production
          - performance
          - monetization
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Retrieve produced editorial evidence
        uses: actions/download-artifact@v4
        with:
          name: vnc-editorial-deliverables
          path: .
      - name: Retrieve new scripts for independent audit
        uses: actions/download-artifact@v4
        with:
          name: vnc-first-batch-scripts
          path: .
      - name: Execute independent specialist
        env:
          AGENT_ID: ${{ matrix.agent }}
        run: python -m agents.team --agent "$AGENT_ID" --root . --output "agent-reports/${AGENT_ID}.json"
      - name: Preserve specialist evidence
        uses: actions/upload-artifact@v4
        with:
          name: vnc-specialist-${{ matrix.agent }}
          path: agent-reports/*.json
          if-no-files-found: error
          retention-days: 14

  coordinator:
    name: Aggregate all eight reports
    needs: [specialists, audio_preflight]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: vnc-specialist-*
          merge-multiple: true
          path: agent-reports/
      - name: Verify and integrate specialist evidence
        run: python -m agents.team --aggregate --input-dir agent-reports --output agent-team-report.json
      - name: Preserve team report
        uses: actions/upload-artifact@v4
        with:
          name: vnc-team-report
          path: agent-team-report.json
          if-no-files-found: error
          retention-days: 14
