name: Verbo no Chão — experimental free Wan2.2 ZeroGPU motion probe

on:
  push:
    branches:
      - "verbo-no-chao/e01-stock-curation-gate-v1"
    paths:
      - "agents/e01_public_zerogpu_motion_probe.py"
      - ".github/workflows/verbo-no-chao-e01-free-motion-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  anonymous-zerogpu-motion-proof:
    # QUARANTINED: legacy external free-GPU experiment. An accidental push or
    # manual dispatch must NEVER issue a new provider request or consume quota.
    # A separately reviewed one-shot workflow may supersede this frozen job.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install public Gradio client and media metadata tools
        run: |
          python -m pip install --disable-pip-version-check "gradio_client>=2.0,<3.0"
          if ! command -v ffprobe >/dev/null || ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg
          fi
      - name: Try one short anonymous text-to-video generation (zero HF tokens, no payments)
        run: timeout --signal=TERM 500s python agents/e01_public_zerogpu_motion_probe.py
      - name: Save only short-lived proof or failure record, not a release master
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vnc-e01-zerogpu-movement-proof-NOT-MASTER
          path: artifacts/e01_zerogpu_smoke/
          if-no-files-found: warn
          retention-days: 1
