name: Verbo no Chão — LTX23 retired remote probe, offline guard only

# MASTER V2 containment (2026-11-20). This used to allow workflow_dispatch
# and unlimited repeats of anonymous GPU provider calls. It is RETIRED for
# production. Reintroducing remote video generation requires a new scoped,
# reviewable, one-shot workflow with run-id/nonce and explicit cost guard.
on:
  push:
    branches:
      - "verbo-no-chao/e01-stock-curation-gate-v1"
    paths:
      - ".github/workflows/verbo-no-chao-e01-ltx23-motion.yml"
      - "tests/test_vnc_provider_replay_containment_v2.py"
      - "tests/test_e01_ltx23_public_probe.py"

permissions:
  contents: read

concurrency:
  group: vnc-ltx23-retired-provider-guard
  cancel-in-progress: false

jobs:
  offline-only:
    name: VNC LTX23 offline tests (zero GPU calls)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Verify static preflight and anti-replay triggers
        run: |
          python -m unittest tests.test_e01_ltx23_public_probe tests.test_vnc_provider_replay_containment_v2 -v

# No workflow_dispatch, schedule, Gradio, provider prediction, upload or publish.
