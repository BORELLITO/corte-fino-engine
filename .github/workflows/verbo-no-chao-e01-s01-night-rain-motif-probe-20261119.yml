name: Verbo no Chão — E01 S01 night rain real stock motif preview (no master)

on:
  push:
    branches:
      - "verbo-no-chao/e01-s01-night-rain-motif-probe-20261119-v1"
    paths:
      - ".github/workflows/verbo-no-chao-e01-s01-night-rain-motif-probe-20261119.yml"

permissions:
  contents: read

concurrency:
  group: vnc-e01-s01-night-rain-motif-20261119
  cancel-in-progress: false

jobs:
  real-night-rain-preview-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned portable FFmpeg/Pillow; no GPU or paid API
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir --retries 0 portable-ffmpeg==0.5.0 Pillow==11.3.0
          python - <<'PY'
          import os
          from pathlib import Path
          from portable_ffmpeg import get_ffmpeg
          ffmpeg, ffprobe = get_ffmpeg()
          root = Path(os.environ["RUNNER_TEMP"])/"vnc-night-rain"
          root.mkdir(parents=True, exist_ok=True)
          for name, source in (("ffmpeg",ffmpeg),("ffprobe",ffprobe)):
              link=root/name
              if link.exists() or link.is_symlink():
                  link.unlink()
              link.symlink_to(Path(source))
          with open(os.environ["GITHUB_PATH"],"a") as out:
              out.write(str(root)+"\n")
          PY
      - name: Adversarial release/identity/rights contract tests
        run: python -m unittest tests.test_e01_s01_night_rain_motif_probe_v1 -v
      - name: Physically download and decode 1 real stock, sample frames and make WATERMARKED preview
        run: |
          set -euo pipefail
          timeout -k 5s 470s python -u -m agents.e01_s01_night_rain_motif_probe_v1 --out artifacts/vnc_s01_night_rain
      - name: Upload only derived QA preview, frame sheet and JSON (no source MP4)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VNC-E01-S01-NIGHT-RAIN-SYMBOLIC-REVIEW-NOT-APPROVED
          path: artifacts/vnc_s01_night_rain/
          retention-days: 1
          if-no-files-found: warn

# No workflow_dispatch, cron, publishing, storage of stock source or other project workflows.
