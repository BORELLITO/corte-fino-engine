name: Verbo no Chão — E01 S01 full-duration LTX23 one-shot prototype

on:
  push:
    branches:
      - "verbo-no-chao/e01-stock-curation-gate-v1"
    paths:
      - "contracts/e01_ltx23_s01_one_shot_trigger_20261118.json"
  workflow_dispatch:

concurrency:
  group: verbo-no-chao-e01-one-shot-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scene01-full-duration:
    if: ${{ github.event_name == 'push' && github.event.head_commit.message == 'vnc-e01-s01-one-shot-free-retest-20261118' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce ADD-only one-time nonce and its exact payload
        run: |
          set -euo pipefail
          nonce=contracts/e01_ltx23_s01_one_shot_trigger_20261118.json
          git diff-tree --no-commit-id --name-status -r "$GITHUB_SHA" | grep -Fx "$(printf 'A\\t%s' "$nonce")"
          test "$(git rev-list --count "$GITHUB_SHA" -- "$nonce")" -eq 1
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path("contracts/e01_ltx23_s01_one_shot_trigger_20261118.json")
          required={
            "episode_id":"VNC-W01-E1",
            "scene_id":"VNC-E01V2-S01",
            "reason":"one-time post-quota free LTX23 retest",
            "publication_authorized":False,
          }
          assert json.loads(path.read_text(encoding="utf-8"))==required, "nonce content mismatch"
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Static safety and duration requirements
        run: python -m unittest tests.test_e01_ltx23_s01_v2_render -v
      - name: Media dependencies
        run: |
          python -m pip install --disable-pip-version-check "gradio_client>=2.0,<3.0"
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg
          fi
      - name: Single public free provider attempt, bounded duration and no retries
        run: timeout -k 5s 175s python -u agents/e01_ltx23_s01_v2_render.py
      - name: Verify actual temporal motion and prepare shot-reference frames (not approved)
        run: python -m agents.e01_s01_video_anchor
      - name: Preserve physical proof and sample frames temporarily
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VNC-E01-S01-LTX23-6SEC-NOT-PUBLISH
          path: artifacts/e01_ltx23_s01_v2/
          retention-days: 1
          if-no-files-found: warn
