name: Verbo no Chão — E01 S01 LTX23 ONE-SHOT (spent nonce; no manual replay)

on:
  push:
    branches:
      - "verbo-no-chao/e01-stock-curation-gate-v1"
    paths:
      - "contracts/e01_ltx23_s01_one_shot_trigger_20261118.json"

concurrency:
  group: vnc-e01-s01-one-shot-20261118
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scene01-full-duration:
    if: ${{ github.event_name == 'push' && github.event.head_commit.message == 'vnc-e01-s01-one-shot-free-retest-20261118' }}
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Reject replay, modification, wrong nonce or mixed commit
        shell: bash
        run: |
          set -euo pipefail
          nonce=contracts/e01_ltx23_s01_one_shot_trigger_20261118.json
          test "$(git diff-tree --no-commit-id --name-status -r "$GITHUB_SHA")" = "$(printf 'A\\t%s' "$nonce")"
          test "$(git rev-list --count "$GITHUB_SHA" -- "$nonce")" -eq 1
          python - <<'PY'
          import json
          from pathlib import Path
          nonce=Path("contracts/e01_ltx23_s01_one_shot_trigger_20261118.json")
          expected={
            "episode_id":"VNC-W01-E1",
            "scene_id":"VNC-E01V2-S01",
            "reason":"one-time post-quota free LTX23 retest",
            "publication_authorized":False
          }
          assert json.loads(nonce.read_text(encoding="utf-8"))==expected
          PY
      - name: Static safety and duration requirements
        run: python -m unittest tests.test_e01_ltx23_s01_v2_render tests.test_e01_s01_runtime_guards_v2 -v
      - name: Pinned no-apt media runtime and single provider client
        shell: bash
        run: |
          set -euo pipefail
          timeout -k 5s 120s python -m pip install --disable-pip-version-check --no-cache-dir --retries 0 "gradio_client==2.7.2" "portable-ffmpeg==0.5.0"
          timeout -k 5s 150s python -m agents.e01_s01_runtime_preflight --out artifacts/e01_ltx23_s01_v2/runtime
          python - <<'PY'
          import os
          from pathlib import Path
          from portable_ffmpeg import get_ffmpeg
          ffmpeg,ffprobe=get_ffmpeg()
          folder=Path(os.environ["RUNNER_TEMP"])/"vnc-validated-media"
          folder.mkdir(parents=True, exist_ok=True)
          for name,path in (("ffmpeg",ffmpeg),("ffprobe",ffprobe)):
              target=folder/name
              if target.exists() or target.is_symlink():
                  target.unlink()
              target.symlink_to(Path(path))
          with open(os.environ["GITHUB_PATH"],"a",encoding="utf-8") as dest:
              dest.write(str(folder)+"\n")
          PY
      - name: Single public free provider attempt, bounded duration, no retries
        run: timeout -k 5s 175s python -u agents/e01_ltx23_s01_v2_render.py
      - name: Verify motion and create reference frames (not approved)
        run: python -m agents.e01_s01_video_anchor
      - name: Preserve physical proof and sample frames only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: VNC-E01-S01-LTX23-6SEC-NOT-PUBLISH
          path: artifacts/e01_ltx23_s01_v2/
          retention-days: 1
          if-no-files-found: warn
