name: Verbo no Chão — S02 hand/desk Ron Lach physical stock QA (one-shot, no release)

# A single exact branch and one newly added workflow-file commit initiate this
# read-only proof. No dispatch, cron, paid provider, AI generation or publication.
on:
  push:
    branches:
      - "verbo-no-chao/e01-s02-human-desk-stock-qa-20261120-v1"
    paths:
      - ".github/workflows/verbo-no-chao-e01-s02-human-desk-one-shot-20261120.yml"

permissions:
  contents: read

concurrency:
  group: vnc-e01-s02-human-desk-9903488-one-shot-20261120
  cancel-in-progress: false

jobs:
  read-only-physical-review:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Fail closed on replay, wrong commit or modified one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          file=.github/workflows/verbo-no-chao-e01-s02-human-desk-one-shot-20261120.yml
          test "$GITHUB_REF_NAME" = "verbo-no-chao/e01-s02-human-desk-stock-qa-20261120-v1"
          test "$(git diff-tree --no-commit-id --name-status -r "$GITHUB_SHA")" = "$(printf 'A\t%s' "$file")"
          test "$(git rev-list --count "$GITHUB_SHA" -- "$file")" -eq 1
      - name: Install exact versions of FFmpeg and Pillow, no apt
        shell: bash
        run: |
          set -euo pipefail
          timeout -k 5s 110s python -m pip install --disable-pip-version-check --no-cache-dir --retries 0 portable-ffmpeg==0.5.0 Pillow==11.3.0
          python - <<'PY'
          import os
          from pathlib import Path
          from portable_ffmpeg import get_ffmpeg
          binary,probe=get_ffmpeg()
          folder=Path(os.environ["RUNNER_TEMP"])/"vnc-s02-hand-desk-binaries"
          folder.mkdir(exist_ok=True,parents=True)
          for name,src in (("ffmpeg",binary),("ffprobe",probe)):
              dst=folder/name
              dst.symlink_to(Path(src))
          with open(os.environ["GITHUB_PATH"],"a",encoding="utf8") as file:
              file.write(str(folder)+"\n")
          PY
      - name: Run offline adversarial scope, stock-rights and release tests
        run: python -m unittest tests.test_e01_s02_human_desk_stock_qa_20261120_v1 -v
      - name: Download exactly one listed free candidate; output only a QA-watermarked 4.9s sample
        shell: bash
        run: |
          set -euo pipefail
          timeout -k 5s 490s python -u -m agents.e01_s02_human_desk_stock_qa_20261120_v1 --out artifacts/vnc_s02_human_desk_9903488
      - name: One-day evidence only; original Pexels stock must never be uploaded
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: VNC-E01-S02-HAND-DESK-9903488-PHYSICAL-QA-UNAPPROVED
          path: artifacts/vnc_s02_human_desk_9903488/
          retention-days: 1
          if-no-files-found: warn
