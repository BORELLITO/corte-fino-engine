name: Verbo no Chão — E01 S03 + S10 two-source physical stock QA (one shot)

# ONLY exact first workflow addition on isolated branch. No replay, no manual
# trigger, no cron, no repo writes, no generation or publication. Source files
# are temporary and never retained, only 540x960 QA fragments and JSON.
on:
  push:
    branches:
      - "verbo-no-chao/e01-multibank-s03-s10-physical-gate-20261120-v1"
    paths:
      - ".github/workflows/verbo-no-chao-e01-s03-s10-mixkit-one-shot-20261120.yml"

permissions:
  contents: read

concurrency:
  group: vnc-e01-s03-s10-mixkit-free-physical-one-shot
  cancel-in-progress: false

jobs:
  source-QA-only:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require exact once-only file addition, not rerun
        shell: bash
        run: |
          set -euo pipefail
          file=.github/workflows/verbo-no-chao-e01-s03-s10-mixkit-one-shot-20261120.yml
          test "$GITHUB_REF_NAME" = "verbo-no-chao/e01-multibank-s03-s10-physical-gate-20261120-v1"
          test "$(git diff-tree --no-commit-id --name-status -r "$GITHUB_SHA")" = "$(printf 'A\t%s' "$file")"
          test "$(git rev-list --count "$GITHUB_SHA" -- "$file")" -eq 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install pinned FFmpeg/Pillow for genuine motion QA
        shell: bash
        run: |
          set -euo pipefail
          timeout -k 5s 110s python -m pip install --disable-pip-version-check --no-cache-dir --retries 0 portable-ffmpeg==0.5.0 Pillow==11.3.0
          python - <<'PY'
          import os
          from pathlib import Path
          from portable_ffmpeg import get_ffmpeg
          ffmpeg,ffprobe=get_ffmpeg()
          dest=Path(os.environ["RUNNER_TEMP"])/"vnc-dual-ffmpeg"
          dest.mkdir(parents=True,exist_ok=True)
          for name,src in (("ffmpeg",ffmpeg),("ffprobe",ffprobe)):
              (dest/name).symlink_to(Path(src))
          with open(os.environ["GITHUB_PATH"],"a",encoding="utf8") as f:
              f.write(str(dest)+"\n")
          PY
      - name: Offline tests for source rights and fail-closed QA
        run: python -m unittest tests.test_e01_mixkit_s03_s10_two_source_qa_20261120_v1 -v
      - name: Download only two exact Free Mixkit URLs, extract actual frames and motion
        shell: bash
        run: |
          set -euo pipefail
          timeout -k 5s 510s python -u -m agents.e01_mixkit_s03_s10_two_source_qa_20261120_v1 --out artifacts/vnc-e01-s03-s10-physical
      - name: Upload ONLY QA derivatives and report, not originals, keep one day
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: VNC-E01-S03-S10-MIXKIT-PHYSICAL-REVIEW-NOT-MASTER
          path: artifacts/vnc-e01-s03-s10-physical/
          retention-days: 1
          if-no-files-found: warn
