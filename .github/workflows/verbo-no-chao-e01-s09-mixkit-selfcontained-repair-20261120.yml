name: Verbo no Chão — E01 S09 Mixkit 4K fixed self-contained physical QA (one shot)

# Repair of one failed external-data QA attempt: prior 44717362393 produced
# 9 real decoded frames but preview failed on an unmerged S01 helper import.
# Reuse the same verified Free Mixkit #99890; no extra creative generation.
on:
  push:
    branches:
      - "verbo-no-chao/e01-multibank-stock-intake-20261120-v1"
    paths:
      - ".github/workflows/verbo-no-chao-e01-s09-mixkit-selfcontained-repair-20261120.yml"

permissions:
  contents: read

concurrency:
  group: vnc-e01-s09-mixkit-99890-fixed-repair-one-shot-20261120
  cancel-in-progress: false

jobs:
  physical-review-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject replay, wrong branch, or a modified workflow
        shell: bash
        run: |
          set -euo pipefail
          file=.github/workflows/verbo-no-chao-e01-s09-mixkit-selfcontained-repair-20261120.yml
          test "$GITHUB_REF_NAME" = "verbo-no-chao/e01-multibank-stock-intake-20261120-v1"
          test "$(git diff-tree --no-commit-id --name-status -r "$GITHUB_SHA")" = "$(printf 'A\t%s' "$file")"
          test "$(git rev-list --count "$GITHUB_SHA" -- "$file")" -eq 1
          test ! -f agents/e01_s01_night_rain_motif_probe_v1.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install exact FFmpeg and Pillow for physical decoding
        shell: bash
        run: |
          set -euo pipefail
          timeout -k 5s 115s python -m pip install --disable-pip-version-check --no-cache-dir --retries 0 portable-ffmpeg==0.5.0 Pillow==11.3.0
          python - <<'PY'
          import os
          from pathlib import Path
          from portable_ffmpeg import get_ffmpeg
          ffmpeg,ffprobe=get_ffmpeg()
          dst=Path(os.environ["RUNNER_TEMP"])/"vnc-s09-ffmpeg"
          dst.mkdir(exist_ok=True,parents=True)
          for name,p in (("ffmpeg",ffmpeg),("ffprobe",ffprobe)):
              (dst/name).symlink_to(Path(p))
          with open(os.environ["GITHUB_PATH"],"a",encoding="utf-8") as output:
              output.write(str(dst)+"\n")
          PY
      - name: Verify media and licensing gates without network
        run: python -m unittest tests.test_e01_multibank_mixkit_s09_qa_20261120_v1 -v
      - name: Sample one Mixkit 4K movie, nine real crops and fixed 5.77s moving QA
        shell: bash
        run: |
          set -euo pipefail
          timeout -k 5s 420s python -u -m agents.e01_mixkit_s09_physical_qa_20261120_v1 --out artifacts/vnc_e01_mixkit99890_s09_repair
      - name: Preserve only watermarked QA and report for 1 day, no raw video
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: VNC-E01-S09-MIXKIT-99890-SUCCESS-OR-BLOCKED-QA-NO-MASTER
          path: artifacts/vnc_e01_mixkit99890_s09_repair/
          retention-days: 1
          if-no-files-found: warn
