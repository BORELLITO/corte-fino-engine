name: Verbo no Chão — E01 stock video physical probe (not a master)

on:
  push:
    branches:
      - "verbo-no-chao/e01-stock-curation-gate-v1"
    paths:
      - "agents/e01_stock_candidates.py"
      - "contracts/e01_v2_stock_candidates_v1.json"
      - "tests/test_e01_stock_candidates.py"
      - ".github/workflows/verbo-no-chao-e01-stock-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stock-metadata-and-physical-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Local contract unit tests
        run: python -m unittest tests.test_e01_stock_candidates -v
      - name: Verify public metadata without downloads
        run: python -m agents.e01_stock_candidates --report stock-probe/metadata.json
      - name: Probe temporary Pexels MP4 bytes in hosted runner
        run: python -m agents.e01_stock_candidates --probe --report stock-probe/physical-qa.json
      - name: Upload report only (never raw media)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verbo-no-chao-e01-stock-probe-${{ github.run_id }}
          path: stock-probe/*.json
          if-no-files-found: warn
          retention-days: 7
