name: Verbo no Chão — E01 stock real-media QA (not a master)

on:
  push:
    branches:
      - "verbo-no-chao/e01-stock-curation-gate-v1"
    paths:
      - "agents/e01_stock_candidates.py"
      - "agents/e01_stock_probe_evidence.py"
      - "agents/e01_stock_frame_qa.py"
      - "contracts/e01_v2_stock_candidates_v1.json"
      - "contracts/e01_v2_stock_physical_probe_evidence_v1.json"
      - "tests/test_e01_stock_candidates.py"
      - "tests/test_e01_stock_probe_evidence.py"
      - "tests/test_e01_stock_frame_qa.py"
      - ".github/workflows/verbo-no-chao-e01-stock-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stock-metadata-and-frame-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal QA dependency
        run: python -m pip install "Pillow>=11.3,<13"
      - name: Run stock preflight and adversarial unit tests
        run: |
          python -m unittest tests.test_e01_stock_candidates tests.test_e01_stock_probe_evidence tests.test_e01_stock_frame_qa -v
          python -m agents.e01_stock_candidates --report stock-probe/metadata.json
      - name: Install FFmpeg and FFprobe only for explicit physical QA
        if: contains(github.event.head_commit.message, '[stock-frame-qa]') || github.event_name == 'workflow_dispatch'
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg
          fi
          command -v ffmpeg
          command -v ffprobe
      - name: One physical download per source, pinned hashes and 12 real frames
        if: contains(github.event.head_commit.message, '[stock-frame-qa]') || github.event_name == 'workflow_dispatch'
        run: python -m agents.e01_stock_frame_qa --out-dir stock-probe
      - name: Preserve short-lived technical QA evidence, never raw MP4
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verbo-no-chao-e01-stock-frame-qa-${{ github.run_id }}
          path: |
            stock-probe/*.json
            stock-probe/*contact-sheet-qa-only.jpg
          if-no-files-found: warn
          retention-days: 2
