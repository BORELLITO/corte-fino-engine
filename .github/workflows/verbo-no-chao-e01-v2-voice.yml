name: Verbo no Chão — E01 v2 voice candidate retired remote rerender, offline QA only

# MASTER V2 (2026-11-20). An archived 70.425-second E01 WAV candidate and
# ASR/caption provenance already exist. Do not re-synthesize old E01 narration
# from manual GitHub Actions or push; old generator code remains untouched.
# A new explicitly approved, nonce-scoped workflow is required to use the host.
on:
  push:
    branches:
      - "verbo-no-chao/e01-stock-curation-gate-v1"
    paths:
      - ".github/workflows/verbo-no-chao-e01-v2-voice.yml"
      - "tests/test_vnc_provider_replay_containment_v2.py"
      - "tests/test_e01_v2_voice_preview.py"

permissions:
  contents: read

concurrency:
  group: vnc-e01-v2-retired-browser-voice-offline
  cancel-in-progress: false

jobs:
  offline-only:
    name: VNC v2 quarantined voice original tests only, no host calls
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Verify old candidate contracts and remote-replay prevention offline
        run: |
          python -m unittest tests.test_e01_v2_voice_preview tests.test_vnc_provider_replay_containment_v2 -v

# No workflow_dispatch, Kokoro browser, Playwright, synthesized WAV, upload,
# auto-release, spend or source asset mutation.
