name: Verbo no Chão — E01 v3 voice candidate audio probe (read-only)

on:
  push:
    branches:
      - "verbo-no-chao/e01-voice-johnes-probe-20261120-v1"
    paths:
      - ".github/workflows/verbo-no-chao-e01-v3-voice-probe.yml"
      - "contracts/e01_v3_voice_probe_link.txt"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check "imageio-ffmpeg==0.6.0"
      - name: Measure candidate audio (no upload, no spend, no publish)
        run: python -m agents.e01_v3_voice_audio_probe contracts/e01_v3_voice_probe_link.txt
