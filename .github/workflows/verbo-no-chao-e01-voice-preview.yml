name: Verbo no Chão — E01 quarantined voice retired remote replay, offline QA only

# MASTER V2 (2026-11-20). Preserve existing E01 WAV evidence with immutable
# provenance; disable historical manually replayable Chrome/Kokoro synthesis.
# Browser/voice generator files remain in Git for forensic recovery, not runs.
on:
  push:
    branches:
      - "verbo-no-chao/e01-stock-curation-gate-v1"
    paths:
      - ".github/workflows/verbo-no-chao-e01-voice-preview.yml"
      - "tests/test_vnc_provider_replay_containment_v2.py"
      - "tests/test_e01_voice_preview.py"

permissions:
  contents: read

concurrency:
  group: vnc-e01-retired-browser-voice-offline
  cancel-in-progress: false

jobs:
  offline-only:
    name: VNC original voice contract tests only, no host calls
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Validate preview contracts and replay protections without network
        run: |
          python -m unittest tests.test_e01_voice_preview tests.test_vnc_provider_replay_containment_v2 -v

# No workflow_dispatch, Kokoro browser, Playwright, synthesized WAV, upload,
# auto-release, spend or source asset mutation.
