name: Verbo no Chão — Pipeline Status (read-only)

on:
  workflow_dispatch:
  push:
    branches:
      - "verbo-no-chao/**"
      - "claude/**"
    paths:
      - "contracts/**"
      - "orchestrator/pipeline.py"

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest tests.test_pipeline -v
      - run: python -m orchestrator.pipeline --output pipeline-status/e01.json
      - uses: actions/upload-artifact@v4
        with:
          name: vnc-pipeline-status-${{ github.run_id }}
          path: pipeline-status/
          retention-days: 14
