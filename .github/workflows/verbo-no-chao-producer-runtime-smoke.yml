name: Verbo no Chão — Producer runtime smoke (Kokoro + Whisper)

on:
  workflow_dispatch:
  push:
    branches:
      - "verbo-no-chao/producer-p0-v1"
    paths:
      - "producer/smoke.py"
      - "producer/voice.py"
      - "producer/captions.py"
      - "requirements-producer.txt"
      - ".github/workflows/verbo-no-chao-producer-runtime-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg + espeak-ng
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng
      - name: Install producer runtime (CPU torch)
        run: |
          python -m pip install --disable-pip-version-check torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check -r requirements-producer.txt
      - name: Smoke — one sentence through Kokoro and ASR alignment
        run: |
          set -o pipefail
          python -m producer.smoke | tee smoke-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: producer-runtime-smoke-${{ github.run_id }}
          path: smoke-report.json
          if-no-files-found: ignore
          retention-days: 14
