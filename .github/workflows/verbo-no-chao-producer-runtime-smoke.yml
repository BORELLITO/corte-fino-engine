name: Verbo no Chão — Producer runtime smoke (ElevenLabs + Whisper)

on:
  workflow_dispatch:
  push:
    branches:
      - "verbo-no-chao/producer-p0-v1"
    paths:
      - "producer/smoke.py"
      - "producer/voice.py"
      - "producer/captions.py"
      - "requirements-producer.txt"
      - ".github/workflows/verbo-no-chao-producer-runtime-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.ELEVENLABS_API_KEY != '' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install producer runtime
        run: |
          python -m pip install --disable-pip-version-check -r requirements-producer.txt
      - name: Import check (no key needed)
        run: python -c "import faster_whisper, ctranslate2, av; print('runtime imports OK')"
      - name: Smoke — one sentence through ElevenLabs and ASR alignment
        if: ${{ env.HAS_KEY == 'true' }}
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          set -o pipefail
          python -m producer.smoke | tee smoke-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: producer-runtime-smoke-${{ github.run_id }}
          path: smoke-report.json
          if-no-files-found: ignore
          retention-days: 14
