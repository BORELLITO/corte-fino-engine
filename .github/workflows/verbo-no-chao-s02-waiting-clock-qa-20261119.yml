name: Verbo no Chão — S02 waiting clock physical stock QA (no master)

on:
  push:
    branches:
      - "verbo-no-chao/e01-s02-waiting-clock-qa-20261119-v1"
    paths:
      - ".github/workflows/verbo-no-chao-s02-waiting-clock-qa-20261119.yml"

permissions:
  contents: read

concurrency:
  group: vnc-s02-waiting-clock-qa-20261119
  cancel-in-progress: false

jobs:
  physical-qa-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Setup pinned FFmpeg, Pillow; no paid provider or GPU
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir --retries 0 portable-ffmpeg==0.5.0 Pillow==11.3.0
          python - <<'PY'
          import os
          from pathlib import Path
          from portable_ffmpeg import get_ffmpeg
          ffmpeg, ffprobe = get_ffmpeg()
          root = Path(os.environ["RUNNER_TEMP"])/"vnc-s02-clock-ffmpeg"
          root.mkdir(parents=True, exist_ok=True)
          for name, source in (("ffmpeg",ffmpeg),("ffprobe",ffprobe)):
              link=root/name
              if link.exists() or link.is_symlink():
                  link.unlink()
              link.symlink_to(Path(source))
          with open(os.environ["GITHUB_PATH"],"a") as out:
              out.write(str(root)+"\n")
          PY
      - name: Offline strict identity, frame alignment and rights tests
        run: |
          python -m unittest tests.test_e01_s01_owner_visual_approval_v1 tests.test_e01_s02_waiting_clock_qa_v1 -v
      - name: Acquire physical stock with safe downloader, decode and render only REVIEW preview
        run: |
          set -euo pipefail
          timeout -k 5s 470s python -u -m agents.e01_s02_waiting_clock_qa_v1 --out artifacts/vnc_s02_clock
      - name: Retain only watermarked review preview, contact sheet and JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VNC-E01-S02-CLOCK-STOCK-REVIEW-NOT-APPROVED
          path: artifacts/vnc_s02_clock/
          retention-days: 1
          if-no-files-found: warn

# Self-only trigger. No cron/manual publication, no raw stock persistent archive,
# no secret credentials and no changes to approved S01 frames or master.
