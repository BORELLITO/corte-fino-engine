name: Verbo no Chão — Voice samples (escolha de voz)

on:
  workflow_dispatch:
  push:
    branches: ["verbo-no-chao/producer-p0-v1"]
    paths: [".github/workflows/verbo-no-chao-voice-samples.yml"]

permissions:
  contents: read

jobs:
  samples:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng
      - run: |
          python -m pip install --disable-pip-version-check torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check -r requirements-producer.txt
      - run: |
          python -m producer.voice_samples samples
          for f in samples/*.wav; do ffmpeg -loglevel error -y -i "$f" -b:a 128k "${f%.wav}.mp3"; done
          ls -la samples
      - uses: actions/upload-artifact@v4
        with:
          name: voice-samples-${{ github.run_id }}
          path: samples/*.mp3
  deliver:
    needs: samples
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: voice-samples-${{ github.run_id }}
          path: samples
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "voices-${{ github.run_id }}" samples/*.mp3 --repo "${{ github.repository }}" \
            --draft --prerelease --title "voice samples ${{ github.run_id }}" --notes "amostras de voz (rascunho privado)"
