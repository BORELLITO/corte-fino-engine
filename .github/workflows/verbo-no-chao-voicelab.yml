name: Verbo no Chão — Voice lab (comparar vozes)

on:
  workflow_dispatch:
  push:
    branches:
      - "verbo-no-chao/producer-p0-v1"
    paths:
      - "producer/voicelab.py"
      - ".github/workflows/verbo-no-chao-voicelab.yml"

permissions:
  contents: read

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng
      - run: |
          python -m pip install --disable-pip-version-check torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check -r requirements-producer.txt
      - name: Piper pt-BR (faber) para comparação
        continue-on-error: true
        run: |
          python -m pip install --disable-pip-version-check piper-tts
          python -m piper.download_voices pt_BR-faber-medium --download-dir piper || true
          mkdir -p lab
          python - <<'PY'
          from piper import PiperVoice
          import wave
          v = PiperVoice.load("piper/pt_BR-faber-medium.onnx")
          from producer.voicelab import TEXT
          with wave.open("lab/piper_faber.wav", "wb") as w:
              v.synthesize_wav(TEXT, w)
          PY
      - name: Kokoro variantes
        run: python -m producer.voicelab lab
      - name: Converter para mp3
        run: |
          cd lab && for f in *.wav; do ffmpeg -nostdin -v error -y -i "$f" -b:a 96k "${f%.wav}.mp3"; done; ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: voicelab-${{ github.run_id }}
          path: lab/*.mp3
          retention-days: 3
  deliver:
    needs: lab
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: voicelab-${{ github.run_id }}
          path: delivered
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: voicelab-${{ github.run_id }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --prerelease --target "$GITHUB_SHA" \
            --title "Voice lab $TAG (rascunho)" --notes "Amostras de voz. Rascunho privado." delivered/*.mp3
