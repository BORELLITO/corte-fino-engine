<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Corte Fino Publisher — TikTok</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0d0d0f; color: #f4f4f5; font: 16px/1.5 system-ui, sans-serif; }
    main { width: min(640px, calc(100% - 40px)); padding: 32px; border: 1px solid #2b2b31; border-radius: 16px; background: #17171b; box-sizing: border-box; }
    h1 { margin: 0 0 10px; font-size: 24px; }
    p { color: #b9b9c2; }
    code { display: block; margin-top: 20px; padding: 14px; overflow-wrap: anywhere; border-radius: 10px; background: #0b0b0d; color: #f5c2e7; }
    .ok { color: #a6e3a1; }
    .error { color: #f38ba8; }
    button { margin-top: 18px; padding: 11px 16px; border: 0; border-radius: 9px; background: #fe2c55; color: white; font-weight: 700; cursor: pointer; }
    button[hidden], code[hidden] { display: none; }
  </style>
</head>
<body>
  <main>
    <h1>Corte Fino Publisher</h1>
    <p id="status">Aguardando retorno da autorização do TikTok…</p>
    <code id="code" hidden></code>
    <button id="copy" hidden>Copiar código temporário</button>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const status = document.querySelector('#status');
    const codeBox = document.querySelector('#code');
    const copy = document.querySelector('#copy');
    const error = params.get('error');
    const code = params.get('code');
    if (error) {
      status.textContent = 'A autorização do TikTok não foi concluída: ' + (params.get('error_description') || error);
      status.className = 'error';
    } else if (code) {
      status.textContent = 'Autorização recebida. O código é temporário e deve ser usado apenas no fluxo do Publisher.';
      status.className = 'ok';
      codeBox.textContent = code;
      codeBox.hidden = false;
      copy.hidden = false;
      copy.addEventListener('click', async () => {
        await navigator.clipboard.writeText(code);
        copy.textContent = 'Código copiado';
      });
    }
  </script>
</body>
</html>
